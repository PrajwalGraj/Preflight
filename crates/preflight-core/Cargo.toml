[package]
name = "preflight-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-client = "=4.0.0"
solana-sdk = "=4.0.0"
solana-transaction-status = "=4.0.0"
solana-transaction-status-client-types = "=4.0.0"
solana-commitment-config = "3"
solana-transaction = "=3.1.0"
solana-message = "=3.1.0"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tungstenite = "0.21"
futures-util = "0.3"
url = "2"
dashmap = "6"
anyhow = "1"
tracing = "0.1"
dotenvy = "0.15"
bincode = "1"
base64 = "0.21"

[[bin]]
name = "test_websocket"
path = "src/bin/test_websocket.rs"

[[bin]]
name = "test_rpc"
path = "src/bin/test_rpc.rs"

[[bin]]
name = "test_engines"
path = "src/bin/test_engines.rs"
